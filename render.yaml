services:
  - type: web
    name: ghar-parivar-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'mkdir -p /var/data && export DATABASE_PATH=/var/data/ghar_parivar.db && exec uvicorn main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/ghar_parivar.db
    disk:
      name: ghar-parivar-data
      mountPath: /var/data
      sizeGB: 1
